name: Nuget Publish

on:
  push:
    branches:
    - release/**

jobs:
  publish:

    env:
      BUILD_CONFIG: 'Release'
      SOLUTION: 'Crystal.Shared.Components.sln'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Get Build Version
      run: |
        Import-Module .\build\get-build-version.psm1
        Write-Host $Env:GITHUB_REF
        $version = GetBuildVersion -VersionString $Env:GITHUB_REF
        echo "BUILD_VERSION=$version" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf-8 -Append
      shell: pwsh

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore $SOLUTION

    - name: Check formatting
      run: dotnet format $SOLUTION --verify-no-changes

    - name: Build
      run: dotnet build $SOLUTION --configuration $BUILD_CONFIG -p:Version=$BUILD_VERSION --no-restore

    - name: Run tests
      run: dotnet test $SOLUTION --configuration $BUILD_CONFIG --no-restore --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage

    - name: Pack
      run: dotnet pack $SOLUTION --configuration $BUILD_CONFIG -p:Version=$BUILD_VERSION --no-build --output ./artifacts

    - name: Publish
      run: dotnet nuget push ./artifacts/**/*.nupkg -s 'https://api.nuget.org/v3/index.json' -k ${{secrets.NUGET_KEY}} --skip-duplicate
